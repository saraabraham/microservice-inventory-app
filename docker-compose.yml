version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  inventory-api:
    build: ./backend/InventoryAPI
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=inventorydb;Username=postgres;Password=postgres"
    depends_on:
      - postgres

  stats-service:
    build: ./stats-service
    ports:
      - "8081:8080"
    environment:
      INVENTORY_API_URL: "http://inventory-api:8080"
    depends_on:
      - inventory-api

  frontend:
    build: ./frontend/inventory-client
    ports:
      - "3000:80"
    depends_on:
      - inventory-api

volumes:
  postgres-data:
